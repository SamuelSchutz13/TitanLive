<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TitanLive</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="bar">
      <div class="col bar-in">
        <a class="brand" href="./">
          <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><defs><mask id="saturn-gap"><rect width="32" height="32" fill="#fff"/><path d="M1.5 16a14.5 4.6 0 0 0 29 0" transform="rotate(-20 16 16)" fill="none" stroke="#000" stroke-width="4.6"/></mask></defs><ellipse cx="16" cy="16" rx="14.5" ry="4.6" transform="rotate(-20 16 16)" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="8.5" fill="currentColor" mask="url(#saturn-gap)"/><path d="M1.5 16a14.5 4.6 0 0 0 29 0" transform="rotate(-20 16 16)" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
          TitanLive
        </a>
        <div class="tools">
          <button id="lang-btn" class="icon-btn" type="button" popovertarget="lang-menu" data-i18n-aria="language"></button>
          <div id="lang-menu" class="menu" popover>
            <button type="button" data-lang="pt">Português</button>
            <button type="button" data-lang="en">English</button>
            <button type="button" data-lang="es">Español</button>
          </div>
          <button id="theme" class="icon-btn" type="button"></button>
        </div>
      </div>
    </header>

    <main class="col">
      <section id="home" aria-labelledby="home-title">
        <div class="home-grid">
          <div>
            <h1 id="home-title" data-i18n="homeTitle"></h1>
            <p class="sub" data-i18n="homeSub"></p>

            <form id="home-form" class="panel home-form" novalidate>
              <div class="field">
                <label for="name" data-i18n="nameLabel"></label>
                <input id="name" maxlength="32" autocomplete="nickname" />
              </div>
              <div class="create">
                <h2 data-i18n="createTitle"></h2>
                <p class="muted" data-i18n="createText"></p>
                <button class="primary" name="action" value="create" data-i18n="createBtn"></button>
              </div>
              <div class="field">
                <h2 data-i18n="joinTitle"></h2>
                <label for="code" data-i18n="codeLabel"></label>
                <div class="joined">
                  <input id="code" autocomplete="off" spellcheck="false" />
                  <button id="join-btn" class="secondary" name="action" value="join" data-i18n="joinBtn"></button>
                </div>
                <p id="room-status" class="room-status faint" aria-live="polite"></p>
              </div>
            </form>
            <p id="home-error" class="error" role="alert"></p>
          </div>

          <!-- A still of the room itself, built from the room's own parts. -->
          <div class="preview" aria-hidden="true">
            <div class="stage is-live">
              <svg class="preview-planet" viewBox="0 0 32 32"><defs><mask id="saturn-gap-2"><rect width="32" height="32" fill="#fff"/><path d="M1.5 16a14.5 4.6 0 0 0 29 0" transform="rotate(-20 16 16)" fill="none" stroke="#000" stroke-width="4.6"/></mask></defs><ellipse cx="16" cy="16" rx="14.5" ry="4.6" transform="rotate(-20 16 16)" fill="none" stroke="currentColor" stroke-width="2.2"/><circle cx="16" cy="16" r="8.5" fill="currentColor" mask="url(#saturn-gap-2)"/><path d="M1.5 16a14.5 4.6 0 0 0 29 0" transform="rotate(-20 16 16)" fill="none" stroke="currentColor" stroke-width="2.2"/></svg>
              <p class="stage-label">Ana</p>
            </div>
            <ul class="people preview-people">
              <li class="speaking"><span class="avatar" style="--h: 28">A</span><span class="who">Ana</span><span class="pill pill-sharing" data-i18n="sharing"></span></li>
              <li><span class="avatar" style="--h: 160">B</span><span class="who">Bia</span><span class="pill pill-muted" data-i18n="muted"></span></li>
              <li><span class="avatar" style="--h: 260">C</span><span class="who">Caio</span></li>
            </ul>
          </div>
        </div>
      </section>

      <section id="room" aria-labelledby="room-title" hidden>
        <div class="room-head">
          <h1 id="room-title"></h1>
          <button id="copy" class="secondary chip"><span data-icon="link"></span><span id="copy-label" data-i18n="copyLink"></span></button>
          <p id="room-meta" class="muted"></p>
        </div>
        <p id="room-error" class="error" role="alert"></p>

        <div class="room-grid">
          <div id="stage" class="stage">
            <video id="stage-video" autoplay playsinline muted></video>
            <p id="stage-label" class="stage-label"></p>
            <p id="stage-speaking" class="stage-speaking" hidden><span id="stage-speaking-icon" aria-hidden="true"></span><span id="stage-speaking-names"></span></p>
            <p class="stage-empty muted" data-i18n="stageEmpty"></p>
            <!-- All call controls in one dock over the stage. -->
            <div class="dock">
              <button id="mic" class="icon-btn"></button>
              <button id="share" class="icon-btn" data-icon="screen"></button>
              <button id="fullscreen" class="icon-btn"></button>
              <button id="leave" class="icon-btn leave" data-i18n-aria="leave" data-icon="leave"></button>
            </div>
          </div>

          <aside class="side">
            <div class="panel">
              <h2 data-i18n="people"></h2>
              <ul id="people" class="people"></ul>
            </div>
            <div class="panel chat">
              <h2 data-i18n="chat"></h2>
              <ol id="messages" class="messages" aria-live="polite"></ol>
              <p id="chat-empty" class="faint" data-i18n="chatEmpty"></p>
              <form id="chat-form" class="joined">
                <button id="attach" class="icon-btn" type="button" data-i18n-aria="attach" data-icon="clip"></button>
                <button id="record" class="icon-btn" type="button" data-i18n-aria="record" data-icon="mic"></button>
                <span class="rec-bar">
                  <button id="rec-cancel" class="icon-btn" type="button" data-i18n-aria="discard" data-icon="trash"></button>
                  <span class="rec-dot" aria-hidden="true"></span>
                  <span id="rec-time" role="timer"></span>
                </span>
                <input id="file" type="file" accept="image/*,video/*,audio/*" hidden />
                <label for="msg" class="sr-only" data-i18n="msgLabel"></label>
                <input id="msg" maxlength="500" autocomplete="off" />
                <button class="icon-btn" data-i18n-aria="send" data-icon="send"></button>
              </form>
            </div>
          </aside>
        </div>
        <div id="audio" hidden></div>
      </section>
    </main>
    <dialog id="lightbox" class="lightbox"><img alt="" /></dialog>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
